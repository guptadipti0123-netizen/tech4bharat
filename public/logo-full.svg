<svg width="600" height="170" viewBox="0 0 600 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ==== Icon (translated copy of logo-icon.svg, 120x120 -> positioned at left) ==== -->
  <g transform="translate(10,15)">
    <!-- Sunrise rays, left side -->
    <g stroke="#D4A017" stroke-width="2.4" stroke-linecap="round">
      <line x1="15" y1="60" x2="4" y2="60" />
      <line x1="17" y1="48" x2="8" y2="42" />
      <line x1="17" y1="72" x2="8" y2="78" />
      <line x1="23" y1="37" x2="16" y2="28" />
      <line x1="23" y1="83" x2="16" y2="92" />
    </g>

    <!-- Saffron arc, top-right -->
    <path d="M 94 46 A 44 44 0 0 0 63 17" stroke="#FF9933" stroke-width="3.4" stroke-linecap="round" fill="none" />

    <!-- Green arc, bottom-left -->
    <path d="M 26 94 A 44 44 0 0 0 16 63" stroke="#1F4E3D" stroke-width="3.4" stroke-linecap="round" fill="none" />

    <!-- Simplified India map outline -->
    <path
      d="M 44 18
         L 64 17
         L 75 29
         L 68 39
         L 73 47
         L 63 55
         L 59 68
         L 54 85
         L 47 65
         L 39 55
         L 43 45
         L 32 37
         L 39 25
         L 44 18 Z"
      stroke="#1F4E3D"
      stroke-width="2"
      fill="none"
      stroke-linejoin="round"
    />

    <!-- Circuit traces from bulb base to bottom nodes -->
    <g stroke="#1F4E3D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 55 66 L 55 72 L 47 72 L 47 80" />
      <path d="M 60 66 L 60 76 L 60 84" />
      <path d="M 65 66 L 65 72 L 73 72 L 73 80" />
    </g>
    <g fill="#1F4E3D">
      <circle cx="47" cy="82" r="2.4" />
      <circle cx="60" cy="86" r="2.4" />
      <circle cx="73" cy="82" r="2.4" />
    </g>

    <!-- Innovation bulb -->
    <g stroke="#D4A017" stroke-width="1.4" stroke-linecap="round">
      <line x1="60" y1="34" x2="60" y2="30" />
      <line x1="52" y1="37" x2="49" y2="34" />
      <line x1="68" y1="37" x2="71" y2="34" />
    </g>
    <circle cx="60" cy="47" r="10" fill="#FFFFFF" stroke="#D4A017" stroke-width="2.2" />
    <path d="M 55 55 L 55 61 L 65 61 L 65 55" stroke="#1F4E3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="56" y1="64" x2="64" y2="64" stroke="#1F4E3D" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ==== Wordmark ==== -->
  <text x="150" y="82" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="44">
    <tspan fill="#1F4E3D">Tech4</tspan><tspan fill="#D4A017">Bharat</tspan>
  </text>

  <!-- Divider line with gold dot -->
  <line x1="150" y1="108" x2="588" y2="108" stroke="#1F4E3D" stroke-width="1" stroke-opacity="0.35" />
  <circle cx="369" cy="108" r="3.2" fill="#D4A017" />

  <!-- Subtitle -->
  <text x="150" y="132" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-weight="500" font-size="17" fill="#555555">
    Building India&#8217;s Innovation Future
  </text>
</svg>
